# ============================================================================
# TCHOP — Kong en mode déclaratif (sans base) : une seule URL publique,
# http://<hôte>:8000, routée vers les services internes.
# /auth/v1/*     -> GoTrue      (login OTP, sessions)
# /rest/v1/*     -> PostgREST   (données : menus, commandes, …)
# /realtime/v1/* -> Realtime    (websocket : cuisine, suivi livreur)
# /storage/v1/*  -> Storage API (logos, photos de plats / preuves)
# NOTE : /functions/v1/* n'est PAS routé en local — les Edge Functions
# Deno se déploient sur Supabase hébergé (`supabase functions deploy`).
# ============================================================================
_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1
        paths: ["/auth/v1"]
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "HEAD"]
          headers: ["Authorization", "Content-Type", "apikey", "x-client-info"]
          exposed_headers: ["Content-Range", "X-Total-Count"]
          credentials: false
          max_age: 3600

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1
        paths: ["/rest/v1"]
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "HEAD"]
          headers: ["Authorization", "Content-Type", "apikey", "x-client-info", "Prefer", "Range"]
          exposed_headers: ["Content-Range", "X-Total-Count"]
          credentials: false
          max_age: 3600

  - name: realtime-v1
    url: http://realtime:4000/socket/
    routes:
      - name: realtime-v1
        paths: ["/realtime/v1"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "OPTIONS"]
          headers: ["Authorization", "Content-Type", "apikey"]
          credentials: false
          max_age: 3600

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1
        paths: ["/storage/v1"]
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "HEAD"]
          headers: ["Authorization", "Content-Type", "apikey", "x-client-info", "x-upsert"]
          exposed_headers: ["Content-Range", "X-Total-Count"]
          credentials: false
          max_age: 3600
